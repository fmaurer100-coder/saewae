<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    color: #17202a;
}

.box {
    width: min(90%, 500px);
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    text-align: center;
    box-sizing: border-box;
}

.notice {
    background: #fff8dc;
    border: 2px solid #f1c40f;
    padding: 18px;
    border-radius: 10px;
    line-height: 1.5;
    margin: 20px 0;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 8px 0;
    border: 2px solid #d5d8dc;
    border-radius: 9px;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: #2471a3;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1b4f72;
}

button:disabled {
    background: #95a5a6;
    cursor: not-allowed;
}

#formArea,
#complete {
    display: none;
}

.complete {
    font-size: 42px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

    <!-- PRIVACY NOTICE -->

    <div id="consent">

        <h2>Privacy Notice</h2>

        <div class="notice">
            By clicking <strong>Continue</strong>, you agree that
            your <strong>name, email address, and public IP address</strong>
            will be collected and sent to
            <strong>fmaurer100@gmail.com</strong>.
        </div>

        <button onclick="giveConsent()">
            Continue
        </button>

    </div>


    <!-- NAME AND EMAIL -->

    <div id="formArea">

        <h2>Complete</h2>

        <input
            type="text"
            id="name"
            placeholder="Your name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your email"
            required
        >

        <button
            id="submitButton"
            onclick="submitInfo()"
        >
            Complete
        </button>

    </div>


    <!-- COMPLETION -->

    <div id="complete">

        <div class="complete">
            COMPLETE
        </div>

    </div>

</div>


<script>

let consentGiven = false;
let visitorIP = "";


/*
    The IP lookup starts ONLY after
    the visitor clicks Continue.
*/

async function giveConsent() {

    consentGiven = true;

    document.getElementById("consent").style.display = "none";

    document.getElementById("formArea").style.display = "block";


    try {

        const response =
            await fetch(
                "https://api.ipify.org?format=json"
            );

        if (!response.ok) {
            throw new Error("IP lookup failed");
        }

        const data =
            await response.json();

        visitorIP = data.ip;

    } catch (error) {

        visitorIP = "Unable to determine";

    }

}


async function submitInfo() {

    if (!consentGiven) {
        return;
    }


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const button =
        document.getElementById("submitButton");


    if (!name) {

        alert("Please enter your name.");

        return;

    }


    if (!email) {

        alert("Please enter your email.");

        return;

    }


    /*
        If the IP lookup hasn't finished,
        wait briefly for it.
    */

    button.disabled = true;
    button.textContent = "Submitting...";


    if (!visitorIP) {

        try {

            const response =
                await fetch(
                    "https://api.ipify.org?format=json"
                );

            const data =
                await response.json();

            visitorIP = data.ip;

        } catch (error) {

            visitorIP = "Unable to determine";

        }

    }


    /*
        Create the FormSubmit request.
    */

    const formData = new FormData();

    formData.append(
        "_subject",
        "New Visitor Information"
    );

    formData.append(
        "_template",
        "table"
    );

    formData.append(
        "Name",
        name
    );

    formData.append(
        "Email",
        email
    );

    formData.append(
        "Public IP Address",
        visitorIP
    );


    try {

        const response =
            await fetch(
                "https://formsubmit.co/fmaurer100@gmail.com",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {
            throw new Error("Submission failed");
        }


        /*
            Show ONLY COMPLETE.
        */

        document.getElementById("formArea").style.display =
            "none";

        document.getElementById("complete").style.display =
            "block";


    } catch (error) {

        button.disabled = false;
        button.textContent = "Complete";

        alert(
            "There was a problem submitting the information. Please try again."
        );

    }

}

</script>

</body>
</html>
