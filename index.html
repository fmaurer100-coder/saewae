<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f3f6fa;
    }

    .box {
        background: white;
        width: min(90%, 500px);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,.15);
        text-align: center;
        box-sizing: border-box;
    }

    .notice {
        margin: 20px 0;
        padding: 15px;
        background: #fff8dc;
        border: 1px solid #e0b800;
        border-radius: 10px;
        line-height: 1.5;
        font-size: 14px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        margin: 7px 0;
        border: 2px solid #d5d8dc;
        border-radius: 9px;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        padding: 14px 28px;
        border: none;
        border-radius: 10px;
        background: #2471a3;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1b4f72;
    }

    #formArea {
        display: none;
    }

    #complete {
        display: none;
        font-size: 42px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="box">

    <!-- CONSENT -->

    <div id="consent">

        <h2>Privacy Notice</h2>

        <div class="notice">
            By clicking <strong>Continue</strong>, you agree that
            your <strong>name, email address, and public IP address</strong>
            will be collected and sent to
            <strong>fmaurer100@gmail.com</strong>.
        </div>

        <button onclick="agree()">
            Continue
        </button>

    </div>


    <!-- INFORMATION FORM -->

    <div id="formArea">

        <h2>Information</h2>

        <input
            type="text"
            id="name"
            placeholder="Your name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your email"
            required
        >

        <button onclick="submitInfo()">
            Complete
        </button>

    </div>


    <!-- COMPLETE -->

    <div id="complete">
        COMPLETE
    </div>

</div>


<script>

let consentGiven = false;
let visitorIP = "";


/* Consent must happen first */
function agree() {

    consentGiven = true;

    document.getElementById("consent").style.display = "none";

    document.getElementById("formArea").style.display = "block";

}


/* Get IP only after consent */
async function getIP() {

    try {

        const response = await fetch(
            "https://api.ipify.org?format=json"
        );

        const data = await response.json();

        visitorIP = data.ip;

    } catch (error) {

        visitorIP = "Unable to determine";

    }

}


/* Submit */
async function submitInfo() {

    if (!consentGiven) {
        return;
    }

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();


    if (!name || !email) {

        alert("Please enter your name and email.");

        return;

    }


    /* Get IP after consent */
    await getIP();


    const formData = new FormData();

    formData.append(
        "_subject",
        "New Visitor"
    );

    formData.append(
        "_template",
        "table"
    );

    formData.append(
        "Name",
        name
    );

    formData.append(
        "Email",
        email
    );

    formData.append(
        "Public IP Address",
        visitorIP
    );


    try {

        await fetch(
            "https://formsubmit.co/fmaurer100@gmail.com",
            {
                method: "POST",
                body: formData
            }
        );

        document.getElementById("formArea").style.display = "none";

        document.getElementById("complete").style.display = "block";

    } catch (error) {

        alert(
            "There was a problem submitting the information."
        );

    }

}

</script>

</body>
</html>
</script>

</body>
</html>
